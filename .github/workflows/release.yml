# Publishes a GitHub release with the daemon binaries whenever src/version.ts on main carries a
# version that has no release yet. Servers and install scripts download the daemon from the latest release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version="$(sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" src/version.ts)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Bun
        if: steps.version.outputs.exists == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          # Same version as used for development; the binaries embed this Bun runtime.
          bun-version: 1.3.11

      - name: Check
        if: steps.version.outputs.exists == 'false'
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test

      - name: Build all targets
        if: steps.version.outputs.exists == 'false'
        run: |
          bun run build.ts
          test "$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' dist/manifest.json)" = "${{ steps.version.outputs.version }}"
          ls -la dist

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/device-mcp-linux-x64.gz dist/device-mcp-linux-arm64.gz \
            dist/device-mcp-darwin-x64.gz dist/device-mcp-darwin-arm64.gz \
            dist/manifest.json \
            --target "$GITHUB_SHA" --title "v${{ steps.version.outputs.version }}" --generate-notes --latest
